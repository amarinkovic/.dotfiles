# CRT-phosphor green palette, cyberpunk/HUD treatment. #00ff41 is the canonical
# "matrix" green: hue is pulled to the yellow side of green so nothing reads
# blue, unlike a spring green such as #00ff99. Every neutral is tinted the same
# way — the darks are a green-black rather than a blue-black.
#
# $magenta is the one non-green hue, used sparingly: the chromatic-aberration
# ghost behind the clock and the status line. Green stays dominant; the magenta
# is there because neon green against hot magenta is the tension that makes the
# palette read cyberpunk rather than plain terminal-green. Drop $magenta to
# $green in those two spots to go mono.
#
# Variable names are deliberately non-prefixing ($green / $phosphor rather than
# $green / $greenPale) — hyprlang substitutes by textual match, so a name that
# is a prefix of another can be swapped out mid-token.

$green      = rgb(0, 255, 65)
$phosphor   = rgb(122, 255, 130)
$magenta    = rgb(255, 0, 128)
$ghost      = rgba(255, 0, 128, 0.4)
$textCol    = rgb(234, 255, 234)
$textDim    = rgba(234, 255, 234, 0.6)

$surface    = rgba(3, 14, 5, 0.62)
$fieldFill  = rgba(3, 14, 5, 0.5)
$rule       = rgba(0, 255, 65, 0.5)

# Colored shadows stand in for the CSS `text-shadow` and inset `box-shadow`
# glows of the waybar/wlogout themes. hyprlock has no inset shadow, so the glow
# is a wide, boosted drop shadow in the accent color instead.
$glowStrong = rgba(0, 255, 65, 0.45)
$glowSoft   = rgba(0, 255, 65, 0.28)

$accentGrad = rgba(0, 255, 65, 0.9) rgba(122, 255, 130, 0.9) 45deg
$checkGrad  = rgba(122, 255, 130, 0.9) rgba(0, 255, 65, 0.9) 45deg
$failGrad   = rgba(255, 0, 128, 0.95) rgba(255, 110, 94, 0.95) 45deg
$capsCol    = rgba(255, 200, 0, 0.95)

# Two type layers. The display layer (clock, date) is condensed grotesque caps —
# the language of instrument panels and tactical overlays, which is what makes
# this read as a HUD rather than as a terminal that happens to be green. The
# terminal layer (user@host, input field, now playing) stays monospaced, because
# those elements *are* shell output and the fixed advance is the point.
#
# Condensed also fixes a real defect in a monospaced clock: mono gives ':' the
# same advance as a digit, so "23:47" renders as "23 : 47" with the two halves
# visually detached. Roboto Condensed kerns them into one readout. Its lining
# figures are uniform-width, so a centered clock doesn't shift as the time ticks.
#
# Bold is the heaviest condensed face ttf-roboto ships — there is no Condensed
# Black, and asking for one silently falls back to Bold. It still reads heavier
# than the ExtraBold mono it replaces, because condensing packs more ink into
# the same width. Size, not weight, is what separates the clock from the date.
#
# Sizes are tuned so the display layer keeps its former footprint: Roboto
# Condensed Bold at 148 inks 503px wide against JetBrainsMono ExtraBold 130's
# 506px, with ~15px more cap height. Retune together if you change either.
#
# Names are deliberately non-prefixing for the same reason as the colors above.
$fontMain   = JetBrainsMono Nerd Font
$fontSemi   = JetBrainsMono Nerd Font SemiBold
$fontDisp   = Roboto Condensed Bold

general {
    hide_cursor        = true
    ignore_empty_input = true
    fail_timeout       = 2500
}

auth {
    # /etc/pam.d/hyprlock ships with the package. No fingerprint reader on this
    # machine, so that backend is left off.
    pam {
        enabled = true
        module  = hyprlock
    }
}

animations {
    enabled = true

    bezier = smooth, 0.16, 1, 0.3, 1

    animation = fadeIn,           1, 5, smooth
    animation = fadeOut,          1, 5, smooth
    animation = inputFieldDots,   1, 2, smooth
    animation = inputFieldColors, 1, 6, smooth
}

# BACKGROUND — blurred screenshot of the desktop, at the original exposure
# values. blur_size is the knob to turn here: blur_passes has a far coarser
# effect, so going to 2 passes is a large jump rather than a nudge. The fallback
# color (only visible if the screencopy fails) is a green-black.
background {
    monitor =
    path    = screenshot
    color   = rgba(3, 14, 5, 1.0)

    blur_passes       = 1
    blur_size         = 6
    noise             = 0.0117
    contrast          = 0.8916
    brightness        = 0.8172
    vibrancy          = 0.1696
    vibrancy_darkness = 0.0

    zindex = -3
}

# CLOCK, CHROMATIC-ABERRATION GHOST — same $TIME text as the real clock, offset
# 5px right/down in magenta and drawn underneath it, which fringes the digit
# edges the way a misconverged CRT or a glitch filter would. Both labels tick
# together since they resolve the same variable. Keep the offset small: past
# ~6px it stops reading as fringing and starts reading as a drop shadow.
label {
    monitor     =
    text        = $TIME
    font_family = $fontDisp
    font_size   = 148
    color       = $ghost

    position = 5, 195
    halign   = center
    valign   = center

    zindex = 0
}

# CLOCK
label {
    monitor     =
    text        = $TIME
    font_family = $fontDisp
    font_size   = 148
    color       = $green

    position = 0, 200
    halign   = center
    valign   = center

    zindex = 1

    shadow_passes = 3
    shadow_size   = 16
    shadow_color  = $glowStrong
    shadow_boost  = 1.3
}

# DATE — letter-spaced caps. The markup has to be emitted by the command: a
# cmd[] label can't be wrapped in tags from the config side.
label {
    monitor     =
    text        = cmd[update:60000] echo "<span letter_spacing='3072'>$(date +'%A, %d %B %Y' | tr '[:lower:]' '[:upper:]')</span>"
    font_family = $fontDisp
    font_size   = 19
    color       = $phosphor

    position = 0, 80
    halign   = center
    valign   = center

    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = $glowSoft
    shadow_boost  = 1.2
}

# HUD DIVIDER — hairline rule separating the clock block from the status line.
shape {
    monitor  =
    size     = 300, 1
    rounding = 0
    color    = $rule

    position = 0, 40
    halign   = center
    valign   = center
}

# AUTH PANEL — square corners and no outline. The frame is the eight bracket
# shapes below instead of a full border, which reads as a HUD reticle rather
# than a dialog box.
#
# Panel geometry, all center-relative (+y is up), and every bracket coordinate
# below is derived from it — retune the brackets if you change these:
#   center (0, -100), size 440x154  ->  x -220..220, y -23..-177
# Contents sit with 28px padding: identity at y -62, input field at y -124.
shape {
    monitor  =
    size     = 440, 154
    rounding = 0
    color    = $surface

    border_size = 0

    position = 0, -100
    halign   = center
    valign   = center

    zindex = -1

    shadow_passes = 3
    shadow_size   = 20
    shadow_color  = $glowSoft
    shadow_boost  = 1.2
}

# CORNER BRACKETS — two 32x2 arms per corner, laid flush inside the panel edge.
# Arms run inward from each corner, so each pair shares one corner pixel.

# top-left
shape {
    monitor  =
    size     = 32, 2
    rounding = 0
    color    = $green
    position = -204, -24
    halign   = center
    valign   = center
}
shape {
    monitor  =
    size     = 2, 32
    rounding = 0
    color    = $green
    position = -219, -39
    halign   = center
    valign   = center
}

# top-right
shape {
    monitor  =
    size     = 32, 2
    rounding = 0
    color    = $green
    position = 204, -24
    halign   = center
    valign   = center
}
shape {
    monitor  =
    size     = 2, 32
    rounding = 0
    color    = $green
    position = 219, -39
    halign   = center
    valign   = center
}

# bottom-left
shape {
    monitor  =
    size     = 32, 2
    rounding = 0
    color    = $green
    position = -204, -176
    halign   = center
    valign   = center
}
shape {
    monitor  =
    size     = 2, 32
    rounding = 0
    color    = $green
    position = -219, -161
    halign   = center
    valign   = center
}

# bottom-right
shape {
    monitor  =
    size     = 32, 2
    rounding = 0
    color    = $green
    position = 204, -176
    halign   = center
    valign   = center
}
shape {
    monitor  =
    size     = 2, 32
    rounding = 0
    color    = $green
    position = 219, -161
    halign   = center
    valign   = center
}

# IDENTITY — user@host in terminal style. Built entirely in the shell rather
# than from hyprlock's $USER so the substitution order inside a cmd[] label
# doesn't matter; `uname -n` is coreutils, unlike `hostname`.
label {
    monitor     =
    text        = cmd[] echo "$(whoami)<span alpha='55%'>@$(uname -n)</span>"
    font_family = $fontSemi
    font_size   = 17
    color       = $textCol
    text_align  = center

    position = 0, -62
    halign   = center
    valign   = center
}

input-field {
    monitor =
    size    = 340, 50

    outline_thickness = 2
    rounding          = 0

    inner_color = $fieldFill
    outer_color = $accentGrad
    check_color = $checkGrad
    fail_color  = $failGrad

    # numlock is on by default (see `input` in hyprland.lua), so only capslock
    # is worth flagging; -1 keeps outer_color for the rest.
    capslock_color = $capsCol
    numlock_color  = -1
    bothlock_color = -1

    font_family = $fontMain
    font_color  = $textCol

    # Square dots to match the panel's square corners.
    dots_size     = 0.26
    dots_spacing  = 0.35
    dots_center   = true
    dots_rounding = 0

    placeholder_text = <span alpha='55%'>&gt; ENTER PASSWORD</span>
    check_text       = <span letter_spacing='2048'>AUTHENTICATING</span>
    # Replaces $FAIL: PAM's text is almost always just "Authentication failure",
    # and the attempt counter is the part actually worth reading.
    fail_text        = <span letter_spacing='2048'><b>ACCESS DENIED</b> [$ATTEMPTS]</span>

    fade_on_empty = false

    position = 0, -124
    halign   = center
    valign   = center

    shadow_passes = 2
    shadow_size   = 12
    shadow_color  = $glowSoft
    shadow_boost  = 1.2
}

# NOW PLAYING — the script prints nothing unless a player is actually playing,
# which leaves this label empty. It can't be inlined here: playerctl's --format
# needs {{...}}, and hyprlang parses that as an arithmetic expression.
label {
    monitor     =
    text        = cmd[update:5000] ~/.config/hypr/scripts/lock-nowplaying.sh
    font_family = $fontMain
    font_size   = 14
    color       = $textDim

    position = 30, 26
    halign   = left
    valign   = bottom

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.6)
    shadow_boost  = 1.2
}
