# Prefer Bluetooth outputs over wired ones (USB speakers sit at 1100),
# so audio switches to a Bluetooth device as soon as it connects.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
